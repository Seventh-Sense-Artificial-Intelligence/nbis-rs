name: nbis build main

on:
  push:
    branches: [ci]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: Linux

    steps:
    - uses: actions/checkout@v4
      with:
          clean: false
    - name: Add cargo to path
      run: echo "/home/ubuntu/.cargo/bin" >> $GITHUB_PATH
    - name: Run rust cargo tests
      run: cargo test --release --all
    - name: Run build
      run: cargo build

  build-python-bindings:
    name: Build Python Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [Linux, macOS]
    needs: [build-and-test]

    steps:
    - uses: actions/checkout@v4
      with:
          clean: false
    - name: Add cargo to path
      run: echo "/home/ubuntu/.cargo/bin" >> $GITHUB_PATH

    - name: Build wheel
      run: |
        rm -rf .nbis-venv
        python3 -m venv .nbis-venv
        source .nbis-venv/bin/activate
        pip install maturin
        maturin build --release --manifest-path Cargo.toml --out dist

    - name: Patch wheel
      run: ./patch_maturin_wheel.sh

    - name: Check wheel integrity
      run: |
        source .nbis-venv/bin/activate
        pip install twine
        twine check dist/nbis_py*

    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
            name: ${{ runner.os }}-wheel
            path: dist/*.whl
  
  test-python-bindings:
    name: Run Pytest on Python Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [Linux, macOS]
    needs: [build-python-bindings]

    steps:
    - uses: actions/checkout@v4
      with:
          clean: false

    - name: Download built wheel
      uses: actions/download-artifact@v4
      with:
        name: ${{ runner.os }}-wheel
        path: dist/

    - name: Install wheel and test dependencies
      run: |
        rm -rf .nbis-venv
        python3 -m venv .nbis-venv
        source .nbis-venv/bin/activate
        pip install dist/*.whl
        pip install -r bindings/python/tests/requirements.txt

    - name: Run pytest
      run: |
        source .nbis-venv/bin/activate
        cd bindings/python/tests
        pytest -v
    
    - name: Upload wheel as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ runner.os }}-wheel
        path: dist/*.whl
        overwrite: true
    
  upload-to-pypi:
    name: Upload All Wheels to PyPI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [Linux, macOS]
    needs: [test-python-bindings]

    steps:
    - name: Download built wheel
      uses: actions/download-artifact@v4
      with:
        name: ${{ runner.os }}-wheel
        path: dist/

    - name: Flatten wheel structure
      run: |
        mkdir final
        find dist -name "*.whl" -exec cp {} final/ \;

    - name: Install Twine
      run: |
        rm -rf .nbis-venv
        python3 -m venv .nbis-venv
        source .nbis-venv/bin/activate
        pip install twine

    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        source .nbis-venv/bin/activate
        twine upload final/*



